# VeloSync 开发基础设施：MySQL 8 + Redis 7
# 用法：docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: velosync-mysql
    environment:
      MYSQL_DATABASE: velosync
      MYSQL_USER: velosync
      MYSQL_PASSWORD: velosync
      MYSQL_ROOT_PASSWORD: root123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: velosync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
